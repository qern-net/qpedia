[package]
name = "qpedia-file-routes"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace]

[dependencies]
qpedia-api = { git = "https://github.com/qern-net/qpedia", tag = "v1.4.0" }
qpedia-core = { git = "https://github.com/qern-net/qpedia", tag = "v1.4.0" }
qpedia-file-archive = { path = "../archive" }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio"] }
